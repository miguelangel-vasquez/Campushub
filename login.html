<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - CampusHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="cuaderno">
  <h1><span>CampusHub</span></h1>
  <p class="sub">Portal universitario CUN</p>

  <form id="form-login">
    <label for="correo">Correo institucional</label>
    <input type="email" id="correo" name="correo" autocomplete="username" required>

    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" autocomplete="current-password" required>

    <button type="submit">Iniciar sesión</button>
    <p id="login-msg" role="alert"></p>
  </form>

  <p class="nota">Acceso para estudiantes y docentes con cuenta activa.</p>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
